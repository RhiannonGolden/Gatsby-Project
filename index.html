<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="script.js"></script>
    <script src="zombies.js"></script>
    <script src="bullet.js"></script>
    <script src="ammo.js"></script>
    <script src="hearts.js"></script>
    <script src="bottle.js"></script>
    <script src="puzzle.js"></script>
    <script src="crate.js"></script>
    <script src="kinema.js"></script>

  </head>
  <body>
    <a-scene physics="debug: false">
        <a-assets>
            <a-asset-item id="zombie" src="zombie/scene.gltf"></a-asset-item>
            <a-asset-item id="bullet" src="bottle_of_champagne/scene.gltf"></a-asset-item>
            <a-asset-item id="ammo1" src="ammo_box/scene.gltf"></a-asset-item>
            <a-asset-item id="hearts" src="medkit/scene.gltf"></a-asset-item>
            <a-asset-item id="bottle" src="bottle_of_champagne/scene.gltf"></a-asset-item>
            <a-asset-item id="crate" src="wooden_crate/scene.gltf"></a-asset-item>

            <img id="puzzle1" src="pictures/puzzle1.jpg">
            <img id="puzzle2" src="pictures/puzzle2.jpg">
            <img id="puzzle3" src="pictures/puzzle3.jpg">
            <img id="puzzle4" src="pictures/puzzle4.jpg">
            <img id="puzzle5" src="pictures/puzzle5.jpg">
            <img id="puzzle6" src="pictures/puzzle6.jpg">
            <img id="puzzle7" src="pictures/puzzle7.jpg">
            <img id="puzzle8" src="pictures/puzzle8.jpg">
            <img id="puzzle9" src="pictures/puzzle9.jpg">
            <img id="puzzle10" src="pictures/puzzle10.jpg">
            <img id="puzzle11" src="pictures/puzzle11.jpg">
            <img id="puzzle12" src="pictures/puzzle12.jpg">
            <img id="puzzle13" src="pictures/puzzle13.jpg">
            <img id="puzzle14" src="pictures/puzzle14.jpg">
            <img id="puzzle15" src="pictures/puzzle15.jpg">
            <img id="puzzle16" src="pictures/puzzle16.jpg">


        </a-assets>


        

        <a-plane position="0 1 -10" width="7" color="brown" rotation="-90 0 0"></a-plane>
        <a-cylinder id="pedestal1" class="pedestal clickable" position="-3 1.21 -10" color="red" radius="0.25" height="0.25"></a-cylinder>
        <a-cylinder id="pedestal2" class="pedestal clickable" position="-1.5 1.21 -10" color="black" radius="0.25" height="0.25"></a-cylinder>
        <a-cylinder id="pedestal3" class="pedestal clickable" position="0 1.21 -10" color="purple" radius="0.25" height="0.25"></a-cylinder>
        <a-cylinder id="pedestal4" class="pedestal clickable" position="1.5 1.21 -10" color="yellow" radius="0.25" height="0.25"></a-cylinder>
        <a-cylinder id="pedestal5" class="pedestal clickable" position="3 1.21 -10" color="blue" radius="0.25" height="0.25"></a-cylinder>


        <a-cylinder position="-3 0.21 -5" color="yellow" radius="0.5" height="0.05"></a-cylinder>
        <a-cylinder position="-1.5 0.21 -5" color="blue" radius="0.5" height="0.05"></a-cylinder>
        <a-cylinder position="0 0.21 -5" color="red" radius="0.5" height="0.05"></a-cylinder>
        <a-cylinder position="1.5 0.21 -5" color="purple" radius="0.5" height="0.05"></a-cylinder>
        <a-cylinder position="3 0.21 -5" color="black" radius="0.5" height="0.05"></a-cylinder>

      
        <a-entity class="picturePuzzle" position="0 3 -7" rotation="0 0 0">
          <a-box color="#000080" width="4.4" height="4" depth="0.1" position="0 0 -0.05"></a-box>

          <a-box color="#000080" width="4.4" height="0.2" depth="0.4" position="0 2.1 0"></a-box>
          <a-box color="#000080" width="4.4" height="0.2" depth="0.4" position="0 -2.1 0"></a-box>
          <a-box color="#000080" width="0.2" height="4.0" depth="0.4" position="-2.1 0 0"></a-box>
          <a-box color="#000080" width="0.2" height="4.0" depth="0.4" position="2.1 0 0"></a-box>

        
        </a-entity>

       
        <a-plane class="clickable" color="green" rotation="-90 0 0" width="50" height="50"></a-plane>

      <a-camera  kinema-body="radius: 0.8" position="0 1.7 0">
        <a-cursor id="cursorID" raycaster="objects: .clickable" material="color: black">
          <a-text id="Phealth" position="-4.5 -0.75 -3" color="black"></a-text>
          <a-text id="ammo_count" position="-4.5 -0.25 -3" color="black"></a-text>
          <a-text id="bottle_score" position="4.8 0.55 -3" color="black"></a-text>
          <a-gltf-model src="#bottle" position="4.5 0.5 -3" scale="1.5 1.5 1.5" rotation="30 20 0"></a-gltf-model>
        </a-cursor>
      </a-camera>

    </a-scene>

    <a-gltf-model src="#zombie"></a-gltf-model>
    <a-gltf-model src="#bullet"></a-gltf-model>
    <a-gltf-model src="#ammo1"></a-gltf-model>
    <a-gltf-model src="#hearts"></a-gltf-model>
    <a-gltf-model src="#crate"></a-gltf-model>

  </body>
</html>
